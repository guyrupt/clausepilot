[project]
name = "clausepilot-backend"
version = "0.1.0"
description = "ClausePilot Travel Inconvenience Insurance Guided Claims Adjudication & Hybrid Policy RAG Backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "numpy>=2.1.0",
    "rank-bm25>=0.2.2",
    "fastembed>=0.4.2",
    "pypdf>=5.1.0",
    "pillow>=11.0.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
